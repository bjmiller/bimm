name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: BIMM-mac
          - os: windows-latest
            artifact: BIMM-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # zizmor: ignore[cache-poisoning] npm caching is disabled (no `cache:` input) and this workflow never runs untrusted code
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Compile
        run: npm run build

      - name: Package (${{ matrix.os }})
        run: npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        run: >
          gh release view "$TAG" >/dev/null 2>&1
          || gh release create "$TAG" --title "BIMM ${TAG#v}" --verify-tag
          --notes "Automated build of ${GITHUB_REF_NAME}. Installers are ad-hoc signed, so macOS may ask you to approve the app on first launch."
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

      - name: Upload release files
        run: gh release upload "$TAG" artifacts/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
